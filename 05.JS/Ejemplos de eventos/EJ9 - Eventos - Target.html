<!DOCTYPE html>
<html>

<head>
<meta content="text/html; charset=utf-8" http-equiv="Content-Type">
<title>Sin título 1</title>
</head>

<body>
<p id="numeros"></p>

<div id="teclado">
	<input type="button" value="1">
	<input type="button" value="2">
	<input type="button" value="3">
	<br/>
	<input type="button" value="4">
	<input type="button" value="5">
	<input type="button" value="6">
	<br/>
	<input type="button" value="7">
	<input type="button" value="8">
	<input type="button" value="9">
	<br/>
	<input type="button" value="0">
</div>

<script type="application/javascript">

var oCapaTeclado = document.getElementById("teclado");

oCapaTeclado.addEventListener("click",manejador,false);

function manejador(oEvento){

	var oE = oEvento || window.event;
	
	var oNumeros = document.getElementById("numeros");
	
	if (oE.target.value)  // <> de undefined => es un click en un botón
		oNumeros.innerHTML += oE.target.value;

	console.log("Target:" + oE.target);
	console.log("currentTarget:" + oE.currentTarget);
}	

	

</script>
</body>

</html>
