<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Bootstrap CSS -->
    <link href="bootstrap/bootstrap.min.css" rel="stylesheet">
    <title>Tarjetas</title>
</head>

<body>
    <!-- Codificar aquí de forma manual lo solicitado en el Apartado C  -->
    <div class="container">
        <h1>LISTADO DE LIBROS DEL GÉNERO <span id="genero"></span></h1>
        <div class="row" id="cards">

        </div>
    </div>
    <script>
        let ventanaPadre = opener;

        generarListado();

        async function generarListado() {
            // Recupero una variable global de la ventana padre
            let idgenero = ventanaPadre.idgenero;
            let respuesta = await ventanaPadre.oGestor.getLibrosGenero(idgenero);

            document.querySelector("#genero").textContent = respuesta.datos[0].genero;

            let cards = "";
            for (fila of respuesta.datos) {
                cards += '<div class="col-12 col-md-4 col-lg-3">';
                cards += '<div class="card" style="width:200px">';
                cards += '<img class="card-img-top" src="' + fila.imagen + '" alt="Card image">';
                cards += '<div class="card-body">';
                cards += '<h4 class="card-title">' + fila.titulo + '</h4>';
                cards += '<h6 class="card-subtitle mb-2 text-muted">' + fila.autor + '</h6>';
                cards += '<h6 class="card-subtitle mb-2 text-muted">' + fila.genero + '</h6>';
                cards += '<p class="card-text">' + fila.descripcion + '</p>';
                cards += '</div>';
                cards += '</div>';
                cards += '</div>';
            }

            document.querySelector("#cards").innerHTML = cards;

        }

    </script>
</body>

</html>
